{% extends "base.html" %}{% from "_macros.html" import field %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
  <h1 class="h4 mb-3">Log in</h1>
  <form method="post" novalidate>
    {{ form.hidden_tag() }}{{ field(form.email) }}{{ field(form.password) }}
    {{ form.submit(class="btn btn-primary") }}
  </form>
  <p class="mt-3 small"><a href="{{ url_for('auth.reset_request') }}">Forgot password?</a></p>
</div></div>
{% endblock %}
